<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>💱 Currency Converter</h1>
        <p>Convert currencies quickly and easily</p>
    </header>

    <div class="converter-card">

        <h2>Convert Currency</h2>

        <label>Enter Amount</label>
        <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="any" value="100">

        <div class="currency-section">

            <div class="currency-box">
                <label>From</label>
                <select id="fromCurrency"></select>
            </div>

            <button id="swapButton" class="swap-button" type="button">⇄</button>

            <div class="currency-box">
                <label>To</label>
                <select id="toCurrency"></select>
            </div>

        </div>

        <button id="convertButton" class="convert-button" type="button">
            Convert Now
        </button>

        <div id="result" class="result">
            Your converted amount will appear here.
        </div>

    </div>

    <div class="history-card">

        <div class="history-heading">
            <h2>Conversion History</h2>
            <button id="refreshButton" type="button">Refresh</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>From</th>
                        <th>To</th>
                        <th>Amount</th>
                        <th>Converted</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="historyBody">
                    <tr>
                        <td colspan="5">Loading history...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
